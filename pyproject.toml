[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trinet-nas-transfer"
version = "0.1.0"
description = "Linux desktop utility for transferring Trinet recordings to a NAS"
readme = "README.md"
requires-python = ">=3.10"
# Runtime Python imports use the standard library. Tkinter and CIFS tools
# must be installed with the operating system package manager (see README).
dependencies = []

[project.scripts]
trinet-nas-transfer = "nas_transfer:main"

[tool.setuptools]
py-modules = ["nas_transfer"]
